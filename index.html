<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IronVault</title>
  <meta name="theme-color" content="#090a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <style>
    :root {
      --bg: #090a0f;
      --card: #14161f;
      --accent: #00f2fe;
      --accent-glow: rgba(0, 242, 254, 0.3);
      --text: #ffffff;
      --text-dim: #7d8597;
      --border: #232736;
      --pr-gold: #ffd700;
      --success: #00e599;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 95px; overflow-x: hidden; }
    
    header { padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: rgba(20, 22, 31, 0.85); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 100; }
    h1 { font-size: 1.4rem; font-weight: 800; background: linear-gradient(90deg, #00f2fe, #4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .container { padding: 18px; }
    
    .view { display: none; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .view.active { display: block; animation: fadeUp 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    
    /* Muscle Grid */
    .muscle-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 10px; }
    .muscle-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 22px 14px; text-align: center; font-weight: 700; font-size: 1.05rem; cursor: pointer; transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1); }
    .muscle-card:active { transform: scale(0.94); border-color: var(--accent); box-shadow: 0 0 16px var(--accent-glow); }
    
    /* Navigation Bar */
    .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .btn-back { background: none; border: none; color: var(--text-dim); font-size: 1.1rem; font-weight: 600; cursor: pointer; }
    .btn-add { background: rgba(0, 242, 254, 0.1); color: var(--accent); border: 1px solid var(--accent); padding: 8px 14px; border-radius: 10px; font-weight: 700; cursor: pointer; }
    
    /* Exercise List */
    .exercise-item { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; font-weight: 600; cursor: pointer; }
    .exercise-item:active { transform: scale(0.97); border-color: var(--accent); }
    
    /* Logger Elements */
    .logger-card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 18px; margin-bottom: 16px; }
    .set-row { display: grid; grid-template-columns: 50px 1fr 1fr 50px; gap: 8px; align-items: center; margin-bottom: 14px; padding: 6px; border-radius: 10px; }
    .ghost-info { font-size: 0.78rem; color: var(--text-dim); margin-bottom: 4px; grid-column: span 4; font-weight: 500; }
    
    input { background: #08090d; border: 1px solid var(--border); color: #fff; padding: 12px 8px; border-radius: 10px; font-size: 1.05rem; font-weight: 700; text-align: center; width: 100%; outline: none; }
    input:focus { border-color: var(--accent); }
    
    .btn-check { background: var(--border); border: none; color: var(--text-dim); border-radius: 10px; height: 44px; cursor: pointer; font-size: 1.1rem; transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .btn-check.completed { background: var(--accent); color: #000; font-weight: 800; transform: scale(1.02); }
    .btn-check.pr-broken { background: var(--pr-gold); color: #000; box-shadow: 0 0 16px rgba(255, 215, 0, 0.5); }
    .row-pr-broken { background: rgba(255, 215, 0, 0.05); border: 1px solid rgba(255, 215, 0, 0.3); }
    
    /* Weight Tracker Card */
    .weight-card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 22px; margin-bottom: 18px; text-align: center; }
    .sunday-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    .sunday-badge.active { background: rgba(0, 229, 153, 0.15); color: var(--success); border: 1px solid var(--success); }
    .sunday-badge.inactive { background: rgba(125, 133, 151, 0.1); color: var(--text-dim); border: 1px solid var(--border); }
    .btn-save-weight { background: var(--accent); color: #000; border: none; padding: 14px; border-radius: 12px; font-weight: 800; font-size: 1rem; width: 100%; margin-top: 14px; cursor: pointer; }
    .btn-save-weight:active { transform: scale(0.97); }
    .delta-badge { font-size: 0.9rem; font-weight: 700; margin-top: 10px; }
    
    /* Bottom Navigation */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; background: rgba(12, 14, 20, 0.95); backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 100; }
    .nav-btn { background: none; border: none; color: var(--text-dim); font-size: 0.8rem; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; flex: 1; }
    .nav-btn i { font-size: 1.4rem; font-style: normal; }
    .nav-btn.active { color: var(--accent); }
    .nav-btn.active i { transform: translateY(-2px); }
    
    /* Filter Pills */
    .filter-pills { display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
    .filter-pills::-webkit-scrollbar { display: none; }
    .pill { background: var(--bg); border: 1px solid var(--border); color: var(--text-dim); padding: 7px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .pill.active { background: var(--accent); color: #000; border-color: var(--accent); }
    select { background: #08090d; border: 1px solid var(--border); color: #fff; padding: 12px 14px; border-radius: 10px; font-size: 0.95rem; font-weight: 600; width: 100%; outline: none; margin-bottom: 16px; }

    /* Fix canvas blowout and force fixed height */
    .chart-wrapper { position: relative; width: 100%; height: 240px; max-height: 240px; overflow: hidden; }
    canvas { width: 100% !important; height: 100% !important; display: block; }
  </style>
</head>
<body>

  <header>
    <h1>IronVault</h1>
    <span id="sync-status" style="font-size: 0.75rem; color: var(--text-dim); font-weight: 600; display: flex; align-items: center; gap: 5px;">
      <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--accent);"></span> Offline Save
    </span>
  </header>

  <div class="container">
    <!-- VIEW 1: MUSCLES -->
    <section id="view-muscles" class="view active">
      <p style="color: var(--text-dim); margin-bottom: 14px; font-weight: 600;">Select target muscle</p>
      <div class="muscle-grid" id="muscle-container"></div>
    </section>

    <!-- VIEW 2: EXERCISES -->
    <section id="view-exercises" class="view">
      <div class="top-bar">
        <button class="btn-back" onclick="switchView('view-muscles')">‹ Back</button>
        <button class="btn-add" onclick="promptAddExercise()">+ New Exercise</button>
      </div>
      <h2 id="selected-muscle-name" style="margin-bottom: 16px; font-size: 1.6rem;"></h2>
      <div id="exercise-list"></div>
    </section>

    <!-- VIEW 3: LOGGER -->
    <section id="view-logger" class="view">
      <div class="top-bar">
        <button class="btn-back" onclick="switchView('view-exercises')">‹ Back</button>
        <span id="logger-status" style="color: var(--pr-gold); font-size: 0.85rem; font-weight: 800;"></span>
      </div>
      <h2 id="logger-exercise-name" style="margin-bottom: 16px; font-size: 1.4rem;"></h2>
      <div class="logger-card" id="sets-container"></div>
    </section>

    <!-- VIEW 4: PROGRESS CHARTS -->
    <section id="view-analytics" class="view">
      <h2 style="margin-bottom: 14px; font-size: 1.3rem;">Strength Curve (1RM)</h2>
      <div class="filter-pills" id="workout-filters">
        <div class="pill active" onclick="setChartRange('workout', 28, this)">28 Days</div>
        <div class="pill" onclick="setChartRange('workout', 90, this)">3 Months</div>
        <div class="pill" onclick="setChartRange('workout', 180, this)">6 Months</div>
        <div class="pill" onclick="setChartRange('workout', 0, this)">All Time</div>
      </div>
      <select id="analytics-exercise-picker" onchange="renderWorkoutChart()"></select>
      <div class="logger-card" style="padding: 12px 8px;">
        <div class="chart-wrapper">
          <canvas id="progressChart"></canvas>
        </div>
      </div>
    </section>

    <!-- VIEW 5: BODY WEIGHT TRACKER -->
    <section id="view-weight" class="view">
      <h2 style="margin-bottom: 14px; font-size: 1.3rem;">Weekly Body Weight</h2>
      <div class="weight-card">
        <div id="sunday-indicator" class="sunday-badge inactive">Checking Day...</div>
        <p style="color: var(--text-dim); font-size: 0.85rem; margin-bottom: 12px;">Log your morning weight</p>
        <div style="display: flex; justify-content: center; align-items: baseline; gap: 8px;">
          <input type="number" id="input-body-weight" placeholder="0.0" step="0.1" inputmode="decimal" style="max-width: 140px; font-size: 1.8rem; height: 60px;">
          <span style="font-size: 1.2rem; font-weight: 700; color: var(--text-dim);">kg</span>
        </div>
        <button class="btn-save-weight" onclick="saveBodyWeight()">Save Weight</button>
        <div id="weight-delta" class="delta-badge" style="color: var(--text-dim);"></div>
      </div>

      <h3 style="font-size: 1.1rem; margin-bottom: 10px; margin-top: 10px;">Weight Trend History</h3>
      <div class="filter-pills" id="weight-filters">
        <div class="pill active" onclick="setChartRange('weight', 28, this)">28 Days</div>
        <div class="pill" onclick="setChartRange('weight', 90, this)">3 Months</div>
        <div class="pill" onclick="setChartRange('weight', 180, this)">6 Months</div>
        <div class="pill" onclick="setChartRange('weight', 0, this)">All Time</div>
      </div>

      <div class="logger-card" style="padding: 12px 8px;">
        <div class="chart-wrapper">
          <canvas id="weightChart"></canvas>
        </div>
      </div>
    </section>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active" id="tab-workout" onclick="openTab('workout')">
      <i>🏋️</i>
      <span>Workout</span>
    </button>
    <button class="nav-btn" id="tab-progress" onclick="openTab('progress')">
      <i>📈</i>
      <span>Progress</span>
    </button>
    <button class="nav-btn" id="tab-weight" onclick="openTab('weight')">
      <i>⚖️</i>
      <span>Weight</span>
    </button>
  </nav>

  <script>
    const GOOGLE_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbyHJQxD5atFQEzm-hyvtwwszZRX3q16JH0INXQYfcp4Y0e4wtYLTUTt9-FL5WGG_pU5/exec"; 

    const MUSCLES = ['Chest', 'Back', 'Shoulder', 'Bicep', 'Tricep', 'Legs', 'Traps', 'Abs'];
    let state = {
      exercises: JSON.parse(localStorage.getItem('iv_exercises') || '[]'),
      logs: JSON.parse(localStorage.getItem('iv_logs') || '[]'),
      weights: JSON.parse(localStorage.getItem('iv_weights') || '[]'),
      activeMuscle: '',
      activeExercise: null,
      chartDaysWorkout: 28,
      chartDaysWeight: 28
    };

    let workoutChart = null;
    let weightChart = null;

    function init() {
      const container = document.getElementById('muscle-container');
      container.innerHTML = MUSCLES.map(m => `<div class="muscle-card" onclick="selectMuscle('${m}')">${m}</div>`).join('');
      checkSundayStatus();
    }

    // --- HELPER: GENERATE CONTINUOUS DATE ARRAY ---
    function getContinuousDates(logs, daysFilter) {
      if (!logs || logs.length === 0) return [];
      
      let startDt = new Date();
      let endDt = new Date();

      if (daysFilter === 0) {
        // All Time: from the earliest log date to today
        startDt = new Date(logs[0].date);
      } else {
        // Limited days: from (today - days) to today
        startDt.setDate(endDt.getDate() - daysFilter + 1);
      }

      const dates = [];
      let currentDt = new Date(startDt);
      while (currentDt <= endDt) {
        const yr = currentDt.getFullYear();
        const mo = String(currentDt.getMonth() + 1).padStart(2, '0');
        const da = String(currentDt.getDate()).padStart(2, '0');
        dates.push(`${yr}-${mo}-${da}`);
        currentDt.setDate(currentDt.getDate() + 1);
      }
      return dates;
    }

    // --- LOGIC & UI ---
    function checkSundayStatus() {
      const today = new Date();
      const badge = document.getElementById('sunday-indicator');
      if (today.getDay() === 0) {
        badge.className = 'sunday-badge active';
        badge.innerText = '⚡ It is Sunday (Check-in Day)';
      } else {
        const daysUntilSunday = 7 - today.getDay();
        badge.className = 'sunday-badge inactive';
        badge.innerText = `Next Sunday check-in in ${daysUntilSunday} day(s)`;
      }
      updateWeightDelta();
    }

    function switchView(viewId) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      setTimeout(() => { document.getElementById(viewId).classList.add('active'); window.scrollTo(0,0); }, 10);
    }

    function selectMuscle(name) {
      state.activeMuscle = name;
      document.getElementById('selected-muscle-name').innerText = name;
      renderExercises();
      switchView('view-exercises');
    }

    function promptAddExercise() {
      const name = prompt(`Enter new exercise for ${state.activeMuscle}:`);
      if (!name || !name.trim()) return;
      const newEx = { id: Date.now(), muscle: state.activeMuscle, name: name.trim() };
      state.exercises.push(newEx);
      localStorage.setItem('iv_exercises', JSON.stringify(state.exercises));
      renderExercises();
    }

    function renderExercises() {
      const list = document.getElementById('exercise-list');
      const filtered = state.exercises.filter(e => e.muscle === state.activeMuscle);
      if (filtered.length === 0) {
        list.innerHTML = `<div style="text-align: center; padding: 40px 20px; color: var(--text-dim);">No exercises yet.</div>`;
        return;
      }
      list.innerHTML = filtered.map(e => `
        <div class="exercise-item" onclick="openLogger(${e.id})">
          <span>${e.name}</span><span style="color: var(--accent);">→</span>
        </div>
      `).join('');
    }

    function openLogger(exerciseId) {
      state.activeExercise = state.exercises.find(e => e.id === exerciseId);
      document.getElementById('logger-exercise-name').innerText = state.activeExercise.name;
      document.getElementById('logger-status').innerText = '';
      
      const lastSession = getLastSessionSets(exerciseId);
      const container = document.getElementById('sets-container');
      
      let html = '';
      for (let i = 1; i <= 3; i++) {
        const prev = lastSession.find(s => s.setNumber === i);
        const prevTxt = prev ? `Last: ${prev.weight}kg × ${prev.reps}` : 'First time logging set';
        html += `
          <div class="set-row" id="row-${i}">
            <div class="ghost-info">${prevTxt}</div>
            <span style="font-weight: 700; color: var(--text-dim); font-size: 0.9rem;">SET ${i}</span>
            <input type="number" id="weight-${i}" placeholder="kg" value="${prev ? prev.weight : ''}" inputmode="decimal">
            <input type="number" id="reps-${i}" placeholder="reps" value="${prev ? prev.reps : ''}" inputmode="numeric">
            <button class="btn-check" onclick="completeSet(${i})">✓</button>
          </div>
        `;
      }
      container.innerHTML = html;
      switchView('view-logger');
    }

    function getLastSessionSets(exId) {
      const exLogs = state.logs.filter(l => l.exerciseId === exId);
      if (exLogs.length === 0) return [];
      const latestDate = exLogs[exLogs.length - 1].date;
      return exLogs.filter(l => l.date === latestDate);
    }

    function completeSet(setNum) {
      const weight = parseFloat(document.getElementById(`weight-${setNum}`).value);
      const reps = parseInt(document.getElementById(`reps-${setNum}`).value);
      if (isNaN(weight) || isNaN(reps) || reps <= 0) return alert('Enter valid weight and reps');

      const est1RM = weight * (1 + reps / 30);
      const historicalMax = Math.max(0, ...state.logs.filter(l => l.exerciseId === state.activeExercise.id).map(l => l.est1RM || 0));
      const isPR = historicalMax > 0 && est1RM > historicalMax;

      // Extract local date reliably
      const now = new Date();
      const yr = now.getFullYear();
      const mo = String(now.getMonth() + 1).padStart(2, '0');
      const da = String(now.getDate()).padStart(2, '0');

      const logEntry = {
        type: 'workout',
        exerciseId: state.activeExercise.id,
        exerciseName: state.activeExercise.name,
        muscleGroup: state.activeExercise.muscle,
        setNumber: setNum,
        weight: weight,
        reps: reps,
        est1RM: parseFloat(est1RM.toFixed(1)),
        isPr: isPR,
        date: `${yr}-${mo}-${da}`,
        time: now.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit' })
      };

      state.logs.push(logEntry);
      localStorage.setItem('iv_logs', JSON.stringify(state.logs));

      const row = document.getElementById(`row-${setNum}`);
      const btn = row.querySelector(`.btn-check`);
      btn.classList.add('completed');
      if (isPR) {
        btn.classList.add('pr-broken');
        row.classList.add('row-pr-broken');
        document.getElementById('logger-status').innerText = '🔥 NEW PR!';
      }
      sendToGoogleSheet(logEntry);
    }

    function saveBodyWeight() {
      const val = parseFloat(document.getElementById('input-body-weight').value);
      if (isNaN(val) || val <= 30 || val >= 300) return alert('Enter a valid weight in kg');

      const now = new Date();
      const yr = now.getFullYear();
      const mo = String(now.getMonth() + 1).padStart(2, '0');
      const da = String(now.getDate()).padStart(2, '0');
      const todayStr = `${yr}-${mo}-${da}`;

      const existingIdx = state.weights.findIndex(w => w.date === todayStr);
      const weightEntry = { type: 'bodyweight', date: todayStr, weight: val };

      if (existingIdx > -1) state.weights[existingIdx] = weightEntry;
      else state.weights.push(weightEntry);

      state.weights.sort((a, b) => a.date.localeCompare(b.date));
      localStorage.setItem('iv_weights', JSON.stringify(state.weights));

      alert('Body weight saved!');
      updateWeightDelta();
      renderWeightChart();
      sendToGoogleSheet(weightEntry);
    }

    function updateWeightDelta() {
      const deltaEl = document.getElementById('weight-delta');
      if (state.weights.length < 2) {
        deltaEl.innerText = state.weights.length === 1 ? `Current: ${state.weights[0].weight} kg` : 'No logs yet';
        return;
      }
      const latest = state.weights[state.weights.length - 1].weight;
      const prev = state.weights[state.weights.length - 2].weight;
      const diff = (latest - prev).toFixed(1);
      const sign = diff > 0 ? `+${diff}` : `${diff}`;
      deltaEl.innerHTML = `Latest: <strong>${latest} kg</strong> (${sign} kg from previous)`;
    }

    // --- CHARTS & NAVIGATION ---
    function openTab(tab) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      if (tab === 'workout') {
        document.getElementById('tab-workout').classList.add('active');
        switchView('view-muscles');
      } else if (tab === 'progress') {
        document.getElementById('tab-progress').classList.add('active');
        populateAnalyticsDropdown();
        switchView('view-analytics');
        renderWorkoutChart();
      } else if (tab === 'weight') {
        document.getElementById('tab-weight').classList.add('active');
        switchView('view-weight');
        checkSundayStatus();
        renderWeightChart();
      }
    }

    function populateAnalyticsDropdown() {
      const picker = document.getElementById('analytics-exercise-picker');
      if (state.exercises.length === 0) { picker.innerHTML = '<option value="">No exercises added</option>'; return; }
      picker.innerHTML = state.exercises.map(e => `<option value="${e.id}">${e.name} (${e.muscle})</option>`).join('');
    }

    function setChartRange(type, days, el) {
      document.querySelectorAll(`#${type}-filters .pill`).forEach(p => p.classList.remove('active'));
      el.classList.add('active');
      if (type === 'workout') {
        state.chartDaysWorkout = days;
        renderWorkoutChart();
      } else {
        state.chartDaysWeight = days;
        renderWeightChart();
      }
    }

    function renderWorkoutChart() {
      const picker = document.getElementById('analytics-exercise-picker');
      const exId = parseInt(picker.value);
      if (!exId) return;

      const exLogs = state.logs.filter(l => l.exerciseId === exId).sort((a, b) => a.date.localeCompare(b.date));
      const timelineDates = getContinuousDates(exLogs, state.chartDaysWorkout);

      // Map data to continuous timeline. Unlogged days return null (Chart.js will bridge them)
      const dataPoints = timelineDates.map(d => {
        const dayLogs = exLogs.filter(l => l.date === d);
        if (dayLogs.length === 0) return null;
        return Math.max(...dayLogs.map(l => l.est1RM));
      });

      const ctx = document.getElementById('progressChart').getContext('2d');
      if (workoutChart) workoutChart.destroy();

      workoutChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: timelineDates.map(d => d.slice(5)), // Format to MM-DD
          datasets: [{
            data: dataPoints,
            borderColor: '#00f2fe',
            backgroundColor: 'rgba(0, 242, 254, 0.08)',
            borderWidth: 2,
            fill: true,
            tension: 0.2, // Smooths lines between distant dates
            spanGaps: true, // IMPORTANT: Draws continuous line over empty days
            pointRadius: dataPoints.filter(d => d !== null).length > 15 ? 2 : 4,
            pointBackgroundColor: '#00f2fe'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: { duration: 250 },
          interaction: { intersect: false, mode: 'index' },
          scales: {
            x: { grid: { color: '#232736', drawTicks: false }, ticks: { color: '#7d8597', maxTicksLimit: 6 } },
            y: { grid: { color: '#232736', drawTicks: false }, ticks: { color: '#7d8597' }, beginAtZero: false }
          },
          plugins: { legend: { display: false } }
        }
      });
    }

    function renderWeightChart() {
      const sortedWeights = [...state.weights].sort((a, b) => a.date.localeCompare(b.date));
      const timelineDates = getContinuousDates(sortedWeights, state.chartDaysWeight);

      // Map data to continuous timeline
      const dataPoints = timelineDates.map(d => {
        const dayLogs = sortedWeights.filter(w => w.date === d);
        if (dayLogs.length === 0) return null;
        return dayLogs[dayLogs.length - 1].weight;
      });

      const ctx = document.getElementById('weightChart').getContext('2d');
      if (weightChart) weightChart.destroy();

      weightChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: timelineDates.map(d => d.slice(5)),
          datasets: [{
            data: dataPoints,
            borderColor: '#00e599',
            backgroundColor: 'rgba(0, 229, 153, 0.08)',
            borderWidth: 2,
            fill: true,
            tension: 0.2,
            spanGaps: true, // Connects the dots across empty days accurately
            pointRadius: dataPoints.filter(d => d !== null).length > 15 ? 2 : 4,
            pointBackgroundColor: '#00e599'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: { duration: 250 },
          interaction: { intersect: false, mode: 'index' },
          scales: {
            x: { grid: { color: '#232736', drawTicks: false }, ticks: { color: '#7d8597', maxTicksLimit: 6 } },
            y: { grid: { color: '#232736', drawTicks: false }, ticks: { color: '#7d8597' }, beginAtZero: false }
          },
          plugins: { legend: { display: false } }
        }
      });
    }

    function sendToGoogleSheet(payload) {
      if (!GOOGLE_WEBHOOK_URL) return;
      document.getElementById('sync-status').innerHTML = '<span style="color:#00f2fe">Syncing...</span>';
      fetch(GOOGLE_WEBHOOK_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).then(() => {
        document.getElementById('sync-status').innerHTML = '<span style="color:#00e599">✓ Cloud Saved</span>';
        setTimeout(() => { document.getElementById('sync-status').innerHTML = '<span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--accent);"></span> Live'; }, 2500);
      }).catch(() => {
        document.getElementById('sync-status').innerText = 'Offline Save';
      });
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }

    init();
  </script>
</body>
</html>
